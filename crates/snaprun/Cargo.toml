[package]
name = "snaprun"
description = "Snapshot testing for any cli program"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
homepage = "https://github.com/adam-gaia/snaprun"
repository = "https://github.com/adam-gaia/snaprun"
include = ["src/**/*", "LICENSE-*", "README.md"]
authors = ["Adam Gaia <git@agaia.dev"]

[dependencies]
anyhow = "1.0.98"
clap = { version = "4.5.45", features = ["derive"] }
different = "0.3.0"
env_logger = "0.11.8"
log = "0.4.27"
serde = { version = "1.0.219", features = ["derive"] }
snapbox = { version = "0.6.21", features = ["cmd"] }
thiserror = "2.0.16"
toml = "0.9.5"
wait-timeout = "0.2.1"
which = "8.0.0"

[dev-dependencies]
trycmd = "0.15.10"
